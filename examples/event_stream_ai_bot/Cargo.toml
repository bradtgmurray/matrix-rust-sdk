[package]
name = "example-event-stream-ai-bot"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
rust-version.workspace = true

[package.metadata.release]
release = false

[[bin]]
name = "example-event-stream-ai-bot"
test = false

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
futures-util.workspace = true
# when copy-pasting this, please use a git dependency or make sure that you
# have copied the example as it was at the time of the release you use.
matrix-sdk = { path = "../../crates/matrix-sdk", features = ["experimental-event-streams"] }
reqwest = { workspace = true, features = ["json", "stream", "rustls"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[lints]
workspace = true
